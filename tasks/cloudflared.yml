# Cloudflare Tunnel はやめた（外へは Tailscale Serve だけで出す）。旧配置の ~/setup に残ったコンテナを止めて消す
- name: Check legacy cloudflared compose.yml
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/setup/compose.yml"
  register: legacy_cloudflared_compose

- name: Remove legacy cloudflared container
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_facts['env']['HOME'] }}/setup"
    state: absent
  when: legacy_cloudflared_compose.stat.exists

- name: Remove legacy cloudflared directory
  # compose.yml にトンネルのトークンが平文で入っているため、コンテナと一緒に消す
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/setup"
    state: absent
