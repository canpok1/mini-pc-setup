# Docker Engine と Compose プラグインを Docker 公式の apt リポジトリから入れる（ADR 0006）。
# 他のタスクはすべてこれが済んでいる前提で動く
- name: Install base packages
  # クリーンインストール直後でも揃っているはずだが、他のタスクが前提にしているので明示する。
  # requests は community.docker のモジュール（docker_login・docker_network）が対象ホストで使う。
  # debian は deb822_repository が対象ホストで使う
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - python3-debian
      - python3-requests
    state: present
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Check if Docker is installed from snap
  # snap 版は Docker 公式の apt 版へ入れ替える（ADR 0009）
  ansible.builtin.command: snap list docker
  register: docker_snap
  changed_when: false
  failed_when: false
  check_mode: false

- name: Replace Docker from snap with the official apt packages
  when: docker_snap.rc == 0
  block:
    - name: List docker volumes before removing snap Docker
      # snap を消すと Docker の管理下のデータ（イメージ・名前付きボリューム）も消える。
      # サービスのデータはすべてホストのディレクトリ（bind mount）にあり、名前付きボリュームは使っていない
      ansible.builtin.command: docker volume ls -q
      register: docker_snap_volumes
      changed_when: false

    - name: Fail if snap Docker has named volumes
      ansible.builtin.fail:
        msg: "snap 版 Docker に名前付きボリュームがあります（{{ docker_snap_volumes.stdout_lines | join(', ') }}）。snap を消すと失われるため入れ替えを止めました。中身を退避してから、もう一度 make deploy してください。"
      when: docker_snap_volumes.stdout_lines | length > 0

    - name: Remove snap Docker
      # 全コンテナがここで止まり、後のタスクの docker compose up で apt 版の上に作り直される。
      # --purge: 消す前の自動の退避（イメージを含み数GBになる）を作らない。イメージは取り直せる
      ansible.builtin.command: snap remove --purge docker
      become: yes

- name: Check if Docker is installed
  # 手で入れた環境では導入の手順を飛ばす。入れ直すと dockerd が再起動し、動いているコンテナがすべて止まる。
  # Ubuntu の docker.io で入れていた場合、公式の containerd.io と衝突する
  ansible.builtin.command: which docker
  register: docker_which
  changed_when: false
  failed_when: false

- name: Install Docker
  when: docker_which.rc != 0
  become: yes
  block:
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker apt signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Enable and start docker
      # 手で入れた環境では触らない。入れ方（snap など）によってはサービス名が docker ではない
      ansible.builtin.systemd_service:
        name: docker
        enabled: yes
        state: started

- name: Check if Docker Compose plugin is available
  # docker_compose_v2 は `docker compose` を呼ぶ。手で入れた環境に無いと、後のタスクが分かりにくい形で失敗する
  ansible.builtin.command: docker compose version
  register: docker_compose_version
  changed_when: false
  failed_when: false

- name: Fail if Docker Compose plugin is missing
  ansible.builtin.fail:
    msg: "Docker は入っていますが `docker compose` が使えません。Docker を入れた方法に合わせて Compose プラグイン（v2）を入れてから、もう一度 make deploy してください。"
  when: docker_compose_version.rc != 0

- name: Create docker group
  # 入れ方（snap など）によってはグループが作られない。無いと次のタスクが失敗する
  ansible.builtin.group:
    name: docker
    state: present
  become: yes

- name: Add login user to docker group
  # 以降のタスクは become せずに docker を操作する
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: yes
  become: yes
  register: docker_group

- name: Reconnect to pick up docker group membership
  # グループの追加は新しいログインから効く。張りっぱなしの SSH 接続を作り直す
  ansible.builtin.meta: reset_connection
  when: docker_group.changed
