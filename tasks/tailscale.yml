- name: Check if Tailscale is installed
  # 手動で入れている場合もあるため、コマンドがあれば導入の手順を飛ばす
  ansible.builtin.command: which tailscale
  register: tailscale_which
  changed_when: false
  failed_when: false

- name: Install Tailscale
  when: tailscale_which.rc != 0
  become: yes
  block:
    - name: Add Tailscale apt signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'

    - name: Add Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} main"
        filename: tailscale
        state: present

    - name: Install Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: yes

- name: Check Tailscale login state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  become: yes

- name: Set Tailscale login state
  ansible.builtin.set_fact:
    tailscale_logged_in: "{{ tailscale_status.rc == 0 and (tailscale_status.stdout | from_json).BackendState == 'Running' }}"

- name: Show how to log in to Tailscale
  # 認証用の鍵をsecretsに置かないため、初回のログインは手動で行う
  ansible.builtin.debug:
    msg: "Tailscale にログインしていないため Serve の設定を飛ばしました。mini-pc で `sudo tailscale up` を実行してログインし、もう一度 make deploy してください。"
  when: not tailscale_logged_in

- name: Check Tailscale Serve config
  ansible.builtin.command: tailscale serve status --json
  register: tailscale_serve_status
  changed_when: false
  become: yes
  when: tailscale_logged_in

- name: Serve trading-studio over HTTPS within the tailnet
  # コンテナは127.0.0.1:3000にだけ公開している。Serveはtailnet内からだけ届き、インターネットには公開されない
  ansible.builtin.command: tailscale serve --bg 3000
  become: yes
  # tailnet で HTTPS 証明書が無効だと、有効にするまで待ち続けるため打ち切る
  timeout: 60
  when:
    - tailscale_logged_in
    - "'127.0.0.1:3000' not in tailscale_serve_status.stdout"
