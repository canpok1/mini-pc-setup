- name: Setup mini PC
  hosts: all
  become: false

  vars_files:
    - vars/secrets.yml

  tasks:
  - name: Check required secrets
    # 足りないと途中のタスクで分かりにくく失敗する。どちらも docs/setup.md の手順で make edit-secrets から足す
    ansible.builtin.assert:
      that:
        - ghcr_token is defined
        - deploy_vault_password is defined
      fail_msg: "vars/secrets.yml に ghcr_token と deploy_vault_password を追加してください（docs/setup.md の「GHCR のトークン」「自動デプロイ」）。"

  - name: Check deploy environment
    # 手元からは inventories/<環境>/group_vars/all.yml、自動デプロイでは /etc/mini-pc-deploy/env.yml で決まる（ADR 0010）
    ansible.builtin.assert:
      that:
        - deploy_env is defined
        - deploy_env in ['production', 'staging']
      fail_msg: "deploy_env が production か staging ではありません。手元からは make deploy-production か make deploy-staging で実行してください。自動デプロイで失敗したときは、手元から一度 make deploy-<環境> してください。"

  - name: Setup docker
    ansible.builtin.import_tasks: tasks/docker.yml

  - name: Back up service data to NAS
    ansible.builtin.import_tasks: tasks/backup.yml
    # 本番と同じ NAS の restic リポジトリへ書き、本番の世代を消しうるため staging では入れない（ADR 0010）
    when: deploy_env == 'production'

  - name: Remove cloudflared
    ansible.builtin.import_tasks: tasks/cloudflared.yml

  - name: Setup plant-diary
    ansible.builtin.import_tasks: tasks/plant-diary.yml

  - name: Setup health-connect-converter
    ansible.builtin.import_tasks: tasks/health-connect-converter.yml
    # 本番と同じ Drive フォルダ・スプレッドシートを読み書きするため staging では入れない（ADR 0010）
    when: deploy_env == 'production'

  - name: Setup trading-studio
    ansible.builtin.import_tasks: tasks/trading-studio.yml

  - name: Setup bifrost
    ansible.builtin.import_tasks: tasks/bifrost.yml

  - name: Setup services
    ansible.builtin.import_tasks: tasks/services.yml

  - name: Setup tailscale
    ansible.builtin.import_tasks: tasks/tailscale.yml

  - name: Update OS automatically
    ansible.builtin.import_tasks: tasks/os-update.yml

  - name: Setup watchtower
    ansible.builtin.import_tasks: tasks/watchtower.yml

  - name: Setup auto-deploy
    ansible.builtin.import_tasks: tasks/auto-deploy.yml
