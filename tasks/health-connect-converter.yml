- name: Set health-connect-converter variables
  ansible.builtin.set_fact:
    src_dir: "{{ ansible_facts['env']['HOME'] }}/src"
    backup_timestamp: "{{ now().strftime('%Y%m%d%H%M%S') }}"

- name: Check if health-connect-converter data directory exists on remote
  ansible.builtin.stat:
    path: "{{ src_dir }}/health-connect-converter/data"
  register: health_connect_converter_data_dir

- name: Create local backup directory for health-connect-converter data
  ansible.builtin.file:
    path: "{{ playbook_dir }}/backup/health-connect-converter/data_{{ backup_timestamp }}"
    state: directory
  delegate_to: localhost
  when: health_connect_converter_data_dir.stat.exists

- name: Backup health-connect-converter data directory from remote to local
  ansible.posix.synchronize:
    src: "{{ src_dir }}/health-connect-converter/data/"
    dest: "{{ playbook_dir }}/backup/health-connect-converter/data_{{ backup_timestamp }}/"
    mode: pull
  when: health_connect_converter_data_dir.stat.exists

- name: Clone health-connect-converter
  ansible.builtin.git:
    repo: "https://github.com/canpok1/health-connect-converter.git"
    dest: "{{ src_dir }}/health-connect-converter"
    version: main
    force: yes

- name: Create secrets directory for health-connect-converter
  ansible.builtin.file:
    path: "{{ src_dir }}/health-connect-converter/secrets"
    state: directory
    mode: '0700'

- name: Place service account key for health-connect-converter
  ansible.builtin.copy:
    content: "{{ health_connect_converter_sa_key }}"
    dest: "{{ src_dir }}/health-connect-converter/secrets/sa-key.json"
    mode: '0600'

- name: Login to GHCR
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "USERNAME"
    password: "{{ lookup('env', 'GH_TOKEN') }}"

- name: Run Docker Compose up for health-connect-converter
  community.docker.docker_compose_v2:
    project_src: "{{ src_dir }}/health-connect-converter"
    state: present
