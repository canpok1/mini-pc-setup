# 旧自動デプロイ（ansible-pull、ADR 0007）が、自身を撤去する変更（ADR 0011）を最後に一度適用するときの接続設定。
# 撤去が本番に反映されたら、このファイルは消してよい。
# 手元や GitHub Actions からの実行は inventories/ の各ホストを使うため、ここは読まれない
ansible_connection: local
# ansible-pull は pipx の venv で動く。モジュールは python3-requests を入れた OS の Python で動かす
ansible_python_interpreter: /usr/bin/python3
# ansible-pull は inventory を使わないため、ここで環境を決める。
# 自動デプロイは本番の mini-pc にだけ入れるので production 固定（ADR 0010）
deploy_env: production
